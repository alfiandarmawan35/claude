<!doctype html>
<html lang="id" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b1a3a; }
      #root { width: 100%; height: 100%; }
      /* satu panggung untuk seluruh film: navy gelap dengan kisi tipis */
      #panggung { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background-color: #0b1a3a;
        background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
        background-size: 80px 80px; }
      #tirai { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: #050c1e; }
    </style>
  </head>
  <body>
    <!-- Video perkenalan PID POS, versi profesional (60 s). Narasi id-ID-ArdiNeural; audio di assets/mix.wav (../suara/mix.py). -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1920" data-height="1080">
      <div id="panggung" class="clip" data-start="0" data-duration="60" data-track-index="0" style="z-index:0"></div>
      <div id="pembuka" data-composition-id="pembuka" data-composition-src="compositions/pembuka.html" data-start="0" data-duration="5.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:1"></div>
      <div id="apa" data-composition-id="apa" data-composition-src="compositions/apa.html" data-start="5.2" data-duration="7.9" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:2"></div>
      <div id="platform" data-composition-id="platform" data-composition-src="compositions/platform.html" data-start="13.1" data-duration="12.5" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:3"></div>
      <div id="alur" data-composition-id="alur" data-composition-src="compositions/alur.html" data-start="25.6" data-duration="12.6" data-track-index="4" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:4"></div>
      <div id="kasir" data-composition-id="kasir" data-composition-src="compositions/kasir.html" data-start="38.2" data-duration="10.0" data-track-index="5" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:5"></div>
      <div id="nilai" data-composition-id="nilai" data-composition-src="compositions/nilai.html" data-start="48.2" data-duration="5.4" data-track-index="6" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:6"></div>
      <div id="penutup" data-composition-id="penutup" data-composition-src="compositions/penutup.html" data-start="53.6" data-duration="6.4" data-track-index="7" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index:7"></div>
      <div id="teks" data-composition-id="teks" data-composition-src="compositions/teks.html" data-start="0" data-duration="60" data-track-index="8" data-track-kind="captions" data-width="1920" data-height="1080" style="z-index:8"></div>
      <div id="tirai" class="clip" data-start="59.3" data-duration="0.7" data-track-index="9" style="z-index:9"></div>
      <audio id="mix" src="assets/mix.wav" data-start="0" data-duration="60" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#tirai", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.in" }, 59.3);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
